kind: class
summary: |
  The base class for all widgets.
extends: Spur.Object
extensibility: abstract

initializer:
  summary: |
    Initializes the widget.

members:
  - kind: method
    name: GetParent
    summary: |
      Returns the parent of the widget.
    returns:
      - summary: |
          The parent of the widget.
        type:
          kind: union
          members:
            - Spur.ManagedContainerWidget
            - Spur.WidgetHost
            - nil

  - kind: method
    name: RemoveParent
    summary: |
      Removes the widget from its parent if the widget has a parent.

  - kind: method
    name: IsDescendantOf
    summary: |
      Returns whether the widget is a descendant of the given widget or not.
    arguments:
      - name: ancestor
        summary: |
          The widget being checked for ancestry.
        type:
          kind: union
          members:
            - Spur.ManagedContainerWidget
            - Spur.WidgetHost
    returns:
      - summary: |
          Whether the widget was a descendant of the given widget or not.
        type: boolean

  - kind: method
    name: SetPosition
    summary: |
      Sets the position of the widget.
    arguments:
      - name: position
        type:
          external: UDim2
          source: roblox

  - kind: method
    name: SetSize
    summary: |
      Sets the size of the widget.
    arguments:
      - name: size
        type:
          external: UDim2
          source: roblox

  - kind: method
    name: Show
    summary: |
      Sets the visibility of the widget to `true`.

  - kind: method
    name: Hide
    summary: |
      Sets the visibility of the widget to `false`.

  - kind: method
    name: _GetRoot
    summary: |
      Returns the root element of the widget.
    visibility: protected
    extensibility: abstract
    returns:
      - type:
          external: GuiObject
          source: roblox

  - kind: method
    name: GetVisibility
    summary: |
      Returns the visibility of the widget.
    extensibility: abstract
    returns:
      - type: boolean

  - kind: method
    name: SetVisibility
    summary: |
      Sets the visibility of the widget.
    extensibility: abstract
    arguments:
      - name: visibility
        type: boolean